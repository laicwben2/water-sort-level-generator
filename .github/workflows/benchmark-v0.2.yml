name: Solver benchmark v0.2

on:
  push:
    branches:
      - feat/generator-v0.2-foundation
    paths:
      - .github/workflows/benchmark-v0.2.yml
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Run 6-16 type benchmark
        run: |
          npm run benchmark -- \
            --min-types=6 \
            --max-types=16 \
            --samples=5 \
            --max-states=100000 \
            --max-empty=5 \
            --max-depth=160 \
            --seed=water-sort-benchmark-v0.2 \
            --output=data/output/solver-benchmark-v0.2.json
      - uses: actions/upload-artifact@v4
        with:
          name: solver-benchmark-v0.2
          path: data/output/solver-benchmark-v0.2.json

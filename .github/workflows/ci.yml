name: CI

on:
  push:
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run generate -- --profile=baseline --count=1 --max-attempts=1000 --output=data/audit/ci-smoke.json
      - run: npm run validate -- --file=data/audit/ci-smoke.json
      - run: npm run export:runtime -- --input=data/audit/ci-smoke.json --output=data/output/ci-smoke.json --pack-id=ci-smoke
      - run: npm run export:solutions -- --input=data/audit/ci-smoke.json --output=data/output/ci-solutions.json
      - run: npm run benchmark -- --min-types=6 --max-types=6 --samples=1 --max-states=10000 --max-empty=3 --output=data/output/benchmark-smoke.json
      - run: npm run report:difficulty -- --input=data/audit/ci-smoke.json --output=data/output/ci-difficulty-report.json

name: CI

on:
  push:
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run generate -- --profile=baseline --count=1 --max-attempts=1000 --output=data/audit/ci-smoke.json
      - run: npm run validate -- --file=data/audit/ci-smoke.json
      - run: npm run export:runtime -- --input=data/audit/ci-smoke.json --output=data/output/ci-smoke.json --pack-id=ci-smoke
      - run: npm run export:solutions -- --input=data/audit/ci-smoke.json --output=data/output/ci-solutions.json
      - run: npm run benchmark -- --min-types=6 --max-types=6 --samples=1 --max-states=10000 --max-empty=3 --output=data/output/benchmark-smoke.json
      - run: npm run generate -- --profile=baseline --count=1 --max-attempts=1000 --analyze-mistakes --mistake-max-states=5000 --mistake-max-path-states=3 --output=data/audit/difficulty-v2-smoke.json
      - run: npm run validate -- --file=data/audit/difficulty-v2-smoke.json
      - run: npm run summarize:difficulty -- --input=data/audit/difficulty-v2-smoke.json --output=data/output/difficulty-v2-summary-smoke.json
      - run: npm run generate -- --profile=expanded --count=1 --max-attempts=1000 --seed=expanded-smoke-2026-09-23 --analyze-mistakes --mistake-max-states=10000 --mistake-max-path-states=8 --output=data/audit/expanded-smoke.json
      - run: npm run validate -- --file=data/audit/expanded-smoke.json
      - run: npm run summarize:difficulty -- --input=data/audit/expanded-smoke.json --output=data/output/expanded-summary-smoke.json
